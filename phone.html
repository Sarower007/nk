<script>/* কাগজের কিনারা খুঁজে বাইরের অংশ বাদ দিয়ে পেজ সোজা করে সাদা-কালো করার অংশ */
(() => {
if (typeof window !== 'undefined' && window.NKFX) return;

const MAX_OUT = 1500;   // ফলাফলের সর্বোচ্চ লম্বা দিক
const MAX_SRC = 2200;   // নমুনা নেওয়ার ছবির সর্বোচ্চ দিক
const AN = 640;         // কিনারা খোঁজার জন্য ছোট কপি

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function scaled(img, maxLong) {
  const sw = img.naturalWidth || img.videoWidth || img.width;
  const sh = img.naturalHeight || img.videoHeight || img.height;
  const k = Math.max(sw, sh) > maxLong ? maxLong / Math.max(sw, sh) : 1;
  const c = cv(Math.round(sw * k), Math.round(sh * k));
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0, c.width, c.height);
  return c;
}

function grayOf(canvas) {
  const w = canvas.width, h = canvas.height;
  const d = canvas.getContext('2d').getImageData(0, 0, w, h).data;
  const g = new Uint8Array(w * h);
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    g[p] = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;
  }
  return g;
}

function otsu(g) {
  const hist = new Float64Array(256);
  for (let i = 0; i < g.length; i++) hist[g[i]]++;
  const total = g.length;
  let sum = 0;
  for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t];
    if (!wB) continue;
    const wF = total - wB;
    if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const v = wB * wF * (mB - mF) * (mB - mF);
    if (v > best) { best = v; thr = t; }
  }
  return thr;
}

/* সবচেয়ে বড় উজ্জ্বল অংশ (কাগজ সাধারণত টেবিলের চেয়ে হালকা) */
function biggestBlob(g, w, h, thr) {
  const lab = new Int32Array(w * h);
  const q = new Int32Array(w * h);
  let cur = 0, bestId = 0, bestArea = 0;
  for (let s = 0; s < w * h; s++) {
    if (lab[s] || g[s] <= thr) continue;
    cur++;
    let head = 0, tail = 0, area = 0;
    q[tail++] = s; lab[s] = cur;
    while (head < tail) {
      const p = q[head++]; area++;
      const x = p % w, y = (p - x) / w;
      if (x > 0 && !lab[p - 1] && g[p - 1] > thr) { lab[p - 1] = cur; q[tail++] = p - 1; }
      if (x < w - 1 && !lab[p + 1] && g[p + 1] > thr) { lab[p + 1] = cur; q[tail++] = p + 1; }
      if (y > 0 && !lab[p - w] && g[p - w] > thr) { lab[p - w] = cur; q[tail++] = p - w; }
      if (y < h - 1 && !lab[p + w] && g[p + w] > thr) { lab[p + w] = cur; q[tail++] = p + w; }
    }
    if (area > bestArea) { bestArea = area; bestId = cur; }
  }
  return { lab, id: bestId, area: bestArea };
}

/* অংশটির চার কোনা — ঘোরানো আয়তক্ষেত্রের জন্য এটাই যথেষ্ট */
function quadOf(lab, id, w, h) {
  let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
  let tl = null, br = null, tr = null, bl = null;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (lab[y * w + x] !== id) continue;
      const s = x + y, df = x - y;
      if (s < a) { a = s; tl = [x, y]; }
      if (s > b) { b = s; br = [x, y]; }
      if (df > d) { d = df; tr = [x, y]; }
      if (df < c) { c = df; bl = [x, y]; }
    }
  }
  if (!tl || !tr || !br || !bl) return null;
  return [tl, tr, br, bl];
}

const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);

function quadOk(quad, w, h) {
  if (!quad) return false;
  const sides = [dist(quad[0], quad[1]), dist(quad[1], quad[2]), dist(quad[2], quad[3]), dist(quad[3], quad[0])];
  const small = Math.min(w, h);
  if (Math.min.apply(null, sides) < small * 0.45) return false;
  // ক্ষেত্রফল (shoelace)
  let ar = 0;
  for (let i = 0; i < 4; i++) {
    const p = quad[i], q = quad[(i + 1) % 4];
    ar += p[0] * q[1] - q[0] * p[1];
  }
  ar = Math.abs(ar) / 2;
  const frac = ar / (w * h);
  return frac > 0.4 && frac < 0.97;
}

/* dst আয়তক্ষেত্র → src চতুর্ভুজ, ৮টি অজানা */
function homography(dst, src) {
  const A = [], B = [];
  for (let i = 0; i < 4; i++) {
    const [u, v] = dst[i], [x, y] = src[i];
    A.push([u, v, 1, 0, 0, 0, -u * x, -v * x]); B.push(x);
    A.push([0, 0, 0, u, v, 1, -u * y, -v * y]); B.push(y);
  }
  for (let i = 0; i < 8; i++) {
    let piv = i;
    for (let r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[piv][i])) piv = r;
    if (Math.abs(A[piv][i]) < 1e-9) return null;
    if (piv !== i) { const t = A[i]; A[i] = A[piv]; A[piv] = t; const tb = B[i]; B[i] = B[piv]; B[piv] = tb; }
    for (let r = i + 1; r < 8; r++) {
      const f = A[r][i] / A[i][i];
      if (!f) continue;
      for (let c2 = i; c2 < 8; c2++) A[r][c2] -= f * A[i][c2];
      B[r] -= f * B[i];
    }
  }
  const X = new Array(8).fill(0);
  for (let i = 7; i >= 0; i--) {
    let s = B[i];
    for (let c2 = i + 1; c2 < 8; c2++) s -= A[i][c2] * X[c2];
    X[i] = s / A[i][i];
  }
  return X;
}

function warp(srcCanvas, quad, outW, outH) {
  const H = homography([[0, 0], [outW, 0], [outW, outH], [0, outH]], quad);
  if (!H) return null;
  const sw = srcCanvas.width, sh = srcCanvas.height;
  const sdat = srcCanvas.getContext('2d').getImageData(0, 0, sw, sh).data;
  const out = cv(outW, outH);
  const octx = out.getContext('2d');
  const odat = octx.createImageData(outW, outH);
  const o = odat.data;
  const [a, b, c, d, e, f, g, hh] = H;
  for (let v = 0; v < outH; v++) {
    for (let u = 0; u < outW; u++) {
      const den = g * u + hh * v + 1;
      const x = (a * u + b * v + c) / den;
      const y = (d * u + e * v + f) / den;
      const i = (v * outW + u) * 4;
      if (x < 0 || y < 0 || x > sw - 1 || y > sh - 1) { o[i] = o[i + 1] = o[i + 2] = 255; o[i + 3] = 255; continue; }
      const x0 = x | 0, y0 = y | 0;
      const x1 = Math.min(x0 + 1, sw - 1), y1 = Math.min(y0 + 1, sh - 1);
      const fx = x - x0, fy = y - y0;
      for (let ch = 0; ch < 3; ch++) {
        const p00 = sdat[(y0 * sw + x0) * 4 + ch], p10 = sdat[(y0 * sw + x1) * 4 + ch];
        const p01 = sdat[(y1 * sw + x0) * 4 + ch], p11 = sdat[(y1 * sw + x1) * 4 + ch];
        o[i + ch] = (p00 * (1 - fx) + p10 * fx) * (1 - fy) + (p01 * (1 - fx) + p11 * fx) * fy;
      }
      o[i + 3] = 255;
    }
  }
  octx.putImageData(odat, 0, 0);
  return out;
}

/* কনট্রাস্ট বাড়ানো ধূসর কপি — পড়ার জন্য ভালো */
function enhance(canvas) {
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d');
  const id = ctx.getImageData(0, 0, w, h);
  const d = id.data;
  const hist = new Float64Array(256);
  for (let i = 0; i < d.length; i += 4) {
    const g = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000 | 0;
    hist[g]++;
  }
  const total = w * h;
  let lo = 0, hi = 255, acc = 0;
  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > total * 0.02) { lo = i; break; } }
  acc = 0;
  for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > total * 0.02) { hi = i; break; } }
  const span = Math.max(1, hi - lo);
  const out = cv(w, h);
  const oid = out.getContext('2d').createImageData(w, h);
  const o = oid.data;
  for (let i = 0; i < d.length; i += 4) {
    let g = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;
    g = ((g - lo) / span) * 255;
    g = g < 0 ? 0 : (g > 255 ? 255 : g);
    o[i] = o[i + 1] = o[i + 2] = g;
    o[i + 3] = 255;
  }
  out.getContext('2d').putImageData(oid, 0, 0);
  return out;
}

/* স্থানীয় গড় ধরে সাদা-কালো (Bradley) — ছায়া পড়লেও লেখা থাকে */
function blackWhite(canvas) {
  const w = canvas.width, h = canvas.height;
  const d = canvas.getContext('2d').getImageData(0, 0, w, h).data;
  const g = new Float64Array(w * h);
  for (let i = 0, p = 0; i < d.length; i += 4, p++) g[p] = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;

  const S = new Float64Array((w + 1) * (h + 1));
  for (let y = 1; y <= h; y++) {
    let rowsum = 0;
    for (let x = 1; x <= w; x++) {
      rowsum += g[(y - 1) * w + (x - 1)];
      S[y * (w + 1) + x] = S[(y - 1) * (w + 1) + x] + rowsum;
    }
  }
  const win = Math.max(15, Math.round(w / 22)) | 1;
  const r = win >> 1;
  const out = cv(w, h);
  const oid = out.getContext('2d').createImageData(w, h);
  const o = oid.data;
  for (let y = 0; y < h; y++) {
    const y1 = Math.max(0, y - r), y2 = Math.min(h - 1, y + r);
    for (let x = 0; x < w; x++) {
      const x1 = Math.max(0, x - r), x2 = Math.min(w - 1, x + r);
      const n = (x2 - x1 + 1) * (y2 - y1 + 1);
      const sum = S[(y2 + 1) * (w + 1) + (x2 + 1)] - S[y1 * (w + 1) + (x2 + 1)]
        - S[(y2 + 1) * (w + 1) + x1] + S[y1 * (w + 1) + x1];
      const mean = sum / n;
      const v = g[y * w + x] < mean * 0.86 ? 0 : 255;
      const i = (y * w + x) * 4;
      o[i] = o[i + 1] = o[i + 2] = v;
      o[i + 3] = 255;
    }
  }
  out.getContext('2d').putImageData(oid, 0, 0);
  return out;
}

function pack(canvas, cap, forceJPEG) {
  let q = 0.88;
  let jpg = canvas.toDataURL('image/jpeg', q);
  if (!forceJPEG) {
    const png = canvas.toDataURL('image/png');
    if (png.length < jpg.length && png.length * 0.75 < cap) return png;
  }
  while (jpg.length * 0.75 > cap && q > 0.35) { q -= 0.12; jpg = canvas.toDataURL('image/jpeg', q); }
  return jpg;
}

window.NKFX = {
  /* কোনো কাটাকুটি নয় — শুধু মাপ ছোট করে রঙিন রাখা */
  plain(img) {
    const c = scaled(img, 1700);
    return { out: pack(c, 1500 * 1024, true), ocr: null, cropped: false };
  },

  /* ছাত্রের ছবি — রঙিন, ৩:৪ */
  photo(img) {
    const sw = img.naturalWidth || img.videoWidth, sh = img.naturalHeight || img.videoHeight;
    const ratio = 3 / 4;
    let cw = sh * ratio, ch = sh;
    if (cw > sw) { cw = sw; ch = sw / ratio; }
    const c = cv(600, 800);
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, 600, 800);
    x.drawImage(img, (sw - cw) / 2, (sh - ch) / 2, cw, ch, 0, 0, 600, 800);
    return { out: pack(c, 700 * 1024, true), ocr: null, cropped: false };
  },

  /* কাগজ — কিনারা খুঁজে সোজা করে সাদা-কালো */
  doc(img, opt) {
    const bw = !opt || opt.bw !== false;
    const src = scaled(img, MAX_SRC);
    const small = scaled(img, AN);
    let straight = null, cropped = false;

    try {
      const g = grayOf(small);
      const thr = otsu(g);
      const blob = biggestBlob(g, small.width, small.height, thr);
      const quad = blob.id ? quadOf(blob.lab, blob.id, small.width, small.height) : null;
      if (quadOk(quad, small.width, small.height)) {
        const k = src.width / small.width;
        const q = quad.map((p) => [p[0] * k, p[1] * k]);
        let ow = (dist(q[0], q[1]) + dist(q[3], q[2])) / 2;
        let oh = (dist(q[0], q[3]) + dist(q[1], q[2])) / 2;
        const sc = Math.max(ow, oh) > MAX_OUT ? MAX_OUT / Math.max(ow, oh) : 1;
        ow = Math.max(200, Math.round(ow * sc));
        oh = Math.max(200, Math.round(oh * sc));
        straight = warp(src, q, ow, oh);
        cropped = !!straight;
      }
    } catch (e) { straight = null; }

    if (!straight) straight = scaled(img, MAX_OUT);

    // রঙিন রাখতে বলা হলে শুধু কিনারা কাটা ও সোজা করা — ছবির রং বদলায় না
    if (opt && opt.color) {
      return { out: pack(straight, 1500 * 1024, true), ocr: null, cropped: cropped };
    }

    const gray = enhance(straight);
    const finalC = bw ? blackWhite(gray) : gray;
    return {
      out: pack(finalC, 1500 * 1024, false),
      ocr: pack(gray, 900 * 1024, true),
      cropped
    };
  },

  process(img, opt) {
    return (opt && opt.doc === false) ? window.NKFX.photo(img) : window.NKFX.doc(img, opt);
  }
};
})();
</script>

  toISO(v) {
    const s = NK.ascii(v).trim();

    if (m) return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');
    m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);
    if (m) return m[3] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');

  candidates(target, val) {
    const raw = String(val == null ? '' : val).trim();
    if (!raw) return [];
    const out = [];
    const push = (x) => { if (x && out.indexOf(String(x)) < 0) out.push(String(x)); };

    if (target.part) {
      const iso = NK.toISO(raw);
      if (!iso) return [];
      const [y, m, d] = iso.split('-');
      if (target.part === 'y') { push(y); push(NK.bangla(y)); }
      if (target.part === 'm') {
        const i = parseInt(m, 10) - 1;
        push(MONTHS_BN[i]); push(MONTHS_EN[i]); push(MONTHS_EN[i].slice(0, 3));
        push(m); push(String(i + 1)); push(NK.bangla(m)); push(NK.bangla(String(i + 1)));
      }
      if (target.part === 'd') {
        const n = String(parseInt(d, 10));
        push(d); push(n); push(NK.bangla(d)); push(NK.bangla(n));
      }
      return out;
    }

    if (target.cls) {
      const n = parseInt(NK.digits(raw), 10);
      push(raw);
      if (n && CLASS_BN[n]) {
        CLASS_BN[n].forEach((name) => { push(name); push(name + ' শ্রেণি'); });
        push(String(n)); push(NK.bangla(String(n)));
      }
      return out;
    }

    push(raw);
    if (/^[০-৯\d\s\-/.]+$/.test(raw)) { push(NK.ascii(raw)); push(NK.bangla(raw)); }
    if (target.geo && typeof window !== 'undefined' && window.NKGEO) {
      window.NKGEO.candidates(target.geo, raw).forEach(push);
    }
    return out;
  },

  check(key, val) {
    const f = NK.FIELDS.find((x) => x.k === key);
    const v = String(val == null ? '' : val).trim();
    if (key === 'জন্ম নিবন্ধন নম্বর') {

      if (d.length !== 17) return d.length + ' অঙ্ক পাওয়া গেছে, হতে হবে ১৭ অঙ্ক';
      return '';
    }
    if (key === 'অভিভাবকের এনআইডি') {
      const d = NK.digits(v);

    }
    if (key === 'মোবাইল নম্বর') {
      const d = NK.digits(v);

      if (!/^01\d{9}$/.test(d)) return '০১ দিয়ে শুরু ১১ অঙ্ক হতে হবে';
      return '';
    }
    if (key === 'জন্ম তারিখ') {
      const iso = NK.toISO(v);
      if (!iso) return 'তারিখ পড়া যায়নি — দিন/মাস/বছর আকারে বসান';
      if (iso < NK.DOB_MIN || iso > NK.DOB_MAX) return 'বয়স সীমার বাইরে (০১/০৯/২০১২ – ৩১/০৮/২০১৬)';
      return '';
    }
    if (!v) return (f && f.opt) ? '' : 'ফাঁকা আছে';
    return '';
  }
};

<script>/* কাগজ পড়ার অংশ — একাধিক key ও মডেল নিয়ে চেষ্টা করে, ব্যস্ত থাকলে নিজেই আবার চেষ্টা করে */
(() => {
  if (window.NKOCR) return;

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const OUT_CAP = 800;   // ফ্রি সীমার নিচে থাকার জন্য আউটপুট টোকেনের ছাদ

  /* base64 → File (Puter.js ফাইল হিসেবেই ছবি নেয়) */
  function b64ToFile(b64, name) {
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new File([u8], name, { type: 'image/jpeg' });
  }

  /* নানা সেবার নানা ধরনের উত্তর থেকে লেখাটা বের করা */
  function textOf(c) {
    if (!c) return '';
    if (typeof c === 'string') return c;
    if (Array.isArray(c)) return c.map((x) => (typeof x === 'string' ? x : (x.text || x.content || ''))).join('\n');
    return c.text || c.content || '';
  }

  function anyText(r) {
    if (!r) return '';
    if (typeof r === 'string') return r;
    if (r.message) return textOf(r.message.content);
    if (r.choices && r.choices[0]) return textOf(r.choices[0].message && r.choices[0].message.content);
    if (r.text) return r.text;
    if (r.content) return textOf(r.content);
    return '';
  }


  /* OpenAI-ধাঁচের যেকোনো সেবার জন্য একই কল (Groq, OpenRouter, নিজের ঠিকানা) */
  async function oai(url, images, promptText, key, model, extraHeaders, tokenKey) {
    const content = [];
    images.forEach((im) => {
      content.push({ type: 'text', text: 'নিচের ছবিটি: ' + im.label });
      content.push({ type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + im.b64 } });
    });
    content.push({ type: 'text', text: promptText });

    const body = { model: model, messages: [{ role: 'user', content: content }] };
    body[tokenKey === 'max_completion_tokens' ? 'max_completion_tokens' : 'max_tokens'] = OUT_CAP;
    body.temperature = 0;

    /* কোনো প্যারামিটার নিয়ে আপত্তি করলে সেটি বদলে বা বাদ দিয়ে আবার চেষ্টা */
    for (let attempt = 0; attempt < 4; attempt++) {
      const res = await fetch(url, {
        method: 'POST',
        headers: Object.assign(
          { 'content-type': 'application/json', authorization: 'Bearer ' + key },
          extraHeaders || {}
        ),
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        const ch = (data.choices || [])[0];
        if (!ch) throw new Error('সেবা কোনো উত্তর দেয়নি');
        return (ch.message && ch.message.content) || '';
      }

      const msg = String((data.error && (data.error.message || data.error)) || ('HTTP ' + res.status));
      let fixed = false;
      if (/max_completion_tokens/i.test(msg) && 'max_tokens' in body) {
        delete body.max_tokens; body.max_completion_tokens = OUT_CAP; fixed = true;
      } else if (/max_tokens/i.test(msg) && /unsupported|not supported|instead/i.test(msg) && 'max_completion_tokens' in body) {
        delete body.max_completion_tokens; body.max_tokens = OUT_CAP; fixed = true;
      } else if (/temperature/i.test(msg) && 'temperature' in body) {
        delete body.temperature; fixed = true;
      } else if (/image_url|image|multimodal|content/i.test(msg) && /unsupported|invalid/i.test(msg) && res.status === 400 && !body.__flat) {
        // কিছু সেবা শুধু লেখা নেয় — তখন আর চেষ্টা করে লাভ নেই
        fixed = false;
      }
      if (!fixed) {
        const err = new Error(msg);
        err.status = res.status;
        throw err;
      }
    }
    throw new Error('সেবাটি অনুরোধ নিচ্ছে না');
  }

  const PROVIDERS = {
    puter: {
      name: 'Puter.js — key ছাড়া ফ্রি (ফোনের পেজে)',
      pageOnly: true,
      noKey: true,
      models: ['google/gemini-3.8-flash', 'google/gemini-3.5-flash', 'google/gemini-3.5-flash-lite', 'openai/gpt-5.4-nano'],
      fallback: ['google/gemini-3.5-flash', 'google/gemini-3.5-flash-lite'],
      keyHint: 'API key লাগে না। প্রথমবার Puter-এ সাইন-ইন করতে বলবে (ফ্রি অ্যাকাউন্ট), তারপর আর চাইবে না।',
      async run(images, promptText, key, model) {
        if (typeof puter === 'undefined' || !puter.ai) {
          throw new Error('Puter.js এই পেজে নেই — ফোনের scan.html থেকে চেষ্টা করুন');
        }
        const order = images.map((im, i) => 'ছবি ' + (i + 1) + ': ' + im.label).join('\n');
        const prompt = (order ? order + '\n\n' : '') + promptText;
        const files = images.map((im, i) => b64ToFile(im.b64, 'doc' + (i + 1) + '.jpg'));
        let resp;
        if (!files.length) resp = await puter.ai.chat(prompt, false, { model: model });
        else if (files.length === 1) resp = await puter.ai.chat(prompt, files[0], false, { model: model });
        else resp = await puter.ai.chat(prompt, files, false, { model: model });
        const out = anyText(resp);
        if (!out) throw new Error('Puter কোনো লেখা ফেরত দেয়নি');
        return out;
      }
    },

    gemini: {
      name: 'Google Gemini (ফ্রি)',
      models: ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.0-flash', 'gemini-3-flash'],
      fallback: ['gemini-2.5-flash-lite', 'gemini-2.0-flash'],
      keyHint: 'aistudio.google.com → Create API key (ফ্রি)',
      async run(images, promptText, key, model, cfg) {
        const parts = [];
        images.forEach((im) => {
          parts.push({ text: 'নিচের ছবিটি: ' + im.label });
          parts.push({ inline_data: { mime_type: 'image/jpeg', data: im.b64 } });
        });
        parts.push({ text: promptText });
        const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' +
          encodeURIComponent(model) + ':generateContent', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
          body: JSON.stringify({
            contents: [{ role: 'user', parts }],
            generationConfig: { temperature: 0, response_mime_type: 'application/json', maxOutputTokens: OUT_CAP }
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const err = new Error((data.error && data.error.message) || ('HTTP ' + res.status));
          err.status = res.status;
          throw err;
        }
        const cand = (data.candidates || [])[0];
        if (!cand) throw new Error('সেবা কোনো উত্তর দেয়নি');
        return (cand.content && cand.content.parts || []).map((p) => p.text || '').join('\n');
      }
    },

    groq: {
      name: 'Groq (ফ্রি, কার্ড লাগে না)',
      models: ['meta-llama/llama-4-scout-17b-16e-instruct', 'qwen/qwen3.6-27b', 'meta-llama/llama-4-maverick-17b-128e-instruct'],
      fallback: ['qwen/qwen3.6-27b', 'meta-llama/llama-4-maverick-17b-128e-instruct'],
      keyHint: 'console.groq.com/keys → Create API Key (ফ্রি, কার্ড ছাড়া)',
      run: (images, promptText, key, model) =>
        oai('https://api.groq.com/openai/v1/chat/completions', images, promptText, key, model,
          null, 'max_completion_tokens')
    },

    openai: {
      name: 'OpenAI / ChatGPT API (key লাগে)',
      models: ['gpt-6-astra', 'gpt-6-astra-pro', 'gpt-5.6-luna'],
      fallback: ['gpt-5.6-luna'],
      keyHint: 'platform.openai.com/api-keys → Create secret key (sk-…)',
      run: (images, promptText, key, model) =>
        oai('https://api.openai.com/v1/chat/completions', images, promptText, key, model,
          null, 'max_completion_tokens')
    },

    huggingface: {
      name: 'Hugging Face Router (মাসিক ফ্রি কোটা)',
      models: [
        'meta-llama/Llama-4-Scout-17B-16E-Instruct:groq',
        'meta-llama/Llama-4-Maverick-17B-128E-Instruct:groq',
        'Qwen/Qwen2.5-VL-72B-Instruct',
        'zai-org/GLM-4.6V'
      ],
      fallback: ['Qwen/Qwen2.5-VL-72B-Instruct'],
      keyHint: 'huggingface.co/settings/tokens → নতুন token, “Make calls to Inference Providers” অনুমতি দিয়ে',
      run: (images, promptText, key, model) =>
        oai('https://router.huggingface.co/v1/chat/completions', images, promptText, key, model)
    },

    openrouter: {
      name: 'OpenRouter (যেকোনো মডেল, টাকা লাগে)',
      models: ['openai/gpt-6-astra', 'openai/gpt-6-astra-pro', 'google/gemini-2.5-flash', 'qwen/qwen2.5-vl-72b-instruct'],
      fallback: [],
      keyHint: 'openrouter.ai/keys — ফ্রি মডেলগুলো ছবির কাজে দুর্বল, gpt-6-astra পেইড',
      run: (images, promptText, key, model) =>
        oai('https://openrouter.ai/api/v1/chat/completions', images, promptText, key, model,
          { 'HTTP-Referer': 'https://notunkurisports.gov.bd', 'X-Title': 'Notun Kuri Form Helper' })
    },

    custom: {
      name: 'নিজের ঠিকানা (OpenAI-ধাঁচের যেকোনো সেবা)',
      models: [],
      fallback: [],
      keyHint: 'সেবার ঠিকানা (base URL) ও মডেলের নাম নিজে লিখুন',
      run: (images, promptText, key, model, cfg) => {
        let base = String((cfg && cfg.baseUrl) || '').trim().replace(/\/+$/, '');
        if (!base) throw new Error('সেবার ঠিকানা (base URL) বসানো হয়নি');
        if (base.indexOf('/chat/completions') < 0) base += '/chat/completions';
        return oai(base, images, promptText, key, model);
      }
    },

    anthropic: {
      name: 'Anthropic Claude (টাকা লাগে)',
      models: ['claude-sonnet-5', 'claude-haiku-4-5-20251001', 'claude-opus-5'],
      fallback: [],
      keyHint: 'console.anthropic.com → API keys',
      async run(images, promptText, key, model, cfg) {
        const content = [];
        images.forEach((im) => {
          content.push({ type: 'text', text: 'নিচের ছবিটি: ' + im.label });
          content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: im.b64 } });
        });
        content.push({ type: 'text', text: promptText });
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'content-type': 'application/json',
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({ model, max_tokens: 2000, messages: [{ role: 'user', content }] })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const err = new Error((data.error && data.error.message) || ('HTTP ' + res.status));
          err.status = res.status;
          throw err;
        }
        return (data.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('\n');
      }
    }
  };

  function buildPrompt(fields) {
    const lines = fields.map((f, i) =>
      (i + 1) + '. ' + f.k + (f.ocr ? '  → ' + f.ocr + ' থেকে' : '  → কাগজে না থাকলে ফাঁকা'));
    return 'তুমি বাংলাদেশের সরকারি কাগজপত্র পড়ে তথ্য তুলে দেওয়ার সহকারী। উপরের ছবিগুলো ভালো করে দেখে নিচের ঘরগুলো পূরণ করো।\n\n' +
      'ঘরের তালিকা (নম্বর সহ):\n' + lines.join('\n') + '\n\n' +
      'নিয়ম:\n' +
      '১. শিক্ষার্থীর নাম, জন্ম তারিখ, জন্ম নিবন্ধন নম্বর, পিতা-মাতার নাম, ঠিকানা — জন্ম নিবন্ধন সনদ থেকে।\n' +
      '২. অভিভাবকের নাম ও এনআইডি নম্বর — এনআইডির ছবি থেকে।\n' +
      '৩. প্রতিষ্ঠানের নাম, শ্রেণি, রোল — প্রত্যয়নপত্র থেকে।\n' +
      '৪. বাংলা নাম বাংলা হরফে, কাগজে যেভাবে আছে হুবহু সেভাবে। ইংরেজি নাম বড় হাতের অক্ষরে।\n' +
      '৫. সব সংখ্যা ইংরেজি অঙ্কে, ফাঁকা বা ড্যাশ ছাড়া। জন্ম নিবন্ধন নম্বর সাধারণত ১৭ অঙ্কের — অঙ্ক গুনে দাও।\n' +
      '৬. জন্ম তারিখ DD/MM/YYYY আকারে। লিঙ্গ শুধু "বালক" বা "বালিকা"। শ্রেণি শুধু সংখ্যায়।\n' +
      '৭. ঠিকানার ঘরে শুধু নামটি — "উপজেলা"/"জেলা" শব্দ যোগ করবে না।\n' +
      '৮. স্পষ্ট না থাকলে "" রাখো, অনুমান করবে না।\n\n' +
      'উত্তর দাও শুধু একটি ছোট JSON — চাবি হবে উপরের নম্বর, আর কোনো লেখা নয়। যেমন:\n' +
      '{"1":"...","2":"...","3":""}';
  }

  /* নম্বরের চাবিগুলো ঘরের নামে ফেরানো */
  function normalize(obj, fields) {
    const out = {};
    fields.forEach((f, i) => {
      let v = obj[String(i + 1)];
      if (v == null) v = obj[i + 1];
      if (v == null) v = obj[f.k];
      out[f.k] = v == null ? '' : String(v).trim();
    });
    return out;
  }

  /* প্রথম পূর্ণ JSON অবজেক্টটি বের করে আনা — পরে বাড়তি লেখা বা দ্বিতীয় অবজেক্ট থাকলেও চলে */
  function cutJSON(text) {
    const s = String(text || '').replace(/```json|```/g, '');
    const start = s.indexOf('{');
    if (start < 0) return '';
    let depth = 0, inStr = false, esc = false;
    for (let i = start; i < s.length; i++) {
      const c = s[i];
      if (inStr) {
        if (esc) esc = false;
        else if (c === '\\') esc = true;
        else if (c === '"') inStr = false;
        continue;
      }
      if (c === '"') { inStr = true; continue; }
      if (c === '{') depth++;
      else if (c === '}') {
        depth--;
        if (depth === 0) return s.slice(start, i + 1);
      }
    }
    return s.slice(start);   // শেষ না হলে যা আছে
  }

  /* উত্তর মাঝপথে থেমে গেলে শেষ পূর্ণ ঘর পর্যন্ত রেখে বন্ধ করা */
  function repair(cut) {
    let t = cut.replace(/,\s*$/, '');
    const last = t.lastIndexOf('",');
    if (t.indexOf('}') < 0 && last > 0) t = t.slice(0, last + 1);
    else t = t.replace(/[^"}\]]*$/, '');
    if (!/"\s*$/.test(t) && !/[}\]]\s*$/.test(t)) t += '"';
    const opens = (t.match(/{/g) || []).length, closes = (t.match(/}/g) || []).length;
    return t + '}'.repeat(Math.max(0, opens - closes));
  }

  function parseJSON(text) {
    const cut = cutJSON(text);
    if (!cut) throw new Error('উত্তরে তথ্য পাওয়া যায়নি: ' + String(text || '').slice(0, 120));
    try {
      return JSON.parse(cut);
    } catch (e) {
      // শেষ } পর্যন্ত ধরে আরেকবার চেষ্টা
      const s = String(text || '').replace(/```json|```/g, '');
      const a = s.indexOf('{'), b = s.lastIndexOf('}');
      if (a >= 0 && b > a) {
        try { return JSON.parse(s.slice(a, b + 1)); } catch (e2) {}
      }
      try { return JSON.parse(repair(cut)); } catch (e3) {}
      throw new Error('উত্তরটি পড়া গেল না: ' + cut.slice(0, 120));
    }
  }

  const busyErr = (m) => /overload|high demand|unavailable|503|500|internal/i.test(m);
  const quotaErr = (m) => /quota|rate|429|exhaust|limit|tpm|otpm|too large/i.test(m);

  function keyList(cfg) {
    const raw = cfg.apiKeys || cfg.apiKey || '';
    return String(raw).split(/[\s,]+/).map((s) => s.trim()).filter(Boolean);
  }

  window.NKOCR = {
    PROVIDERS,
    buildPrompt,
    parseJSON,

    async read(cfg, images, fields, onStatus) {
      const p = PROVIDERS[cfg.provider || 'gemini'];
      if (!p) throw new Error('অজানা সেবা');
      const keys = p.noKey ? [''] : keyList(cfg);
      if (!keys.length) throw new Error('API key বসানো হয়নি');
      const models = [cfg.model || p.models[0] || ''].concat(p.fallback)
        .filter((m, i, a) => m && a.indexOf(m) === i);
      const promptText = buildPrompt(fields);
      let last = null;

      for (const model of models) {
        for (let ki = 0; ki < keys.length; ki++) {
          for (let attempt = 0; attempt < 2; attempt++) {
            try {
              if (onStatus) {
                onStatus('পড়া হচ্ছে — ' + model + (keys.length > 1 ? ' (key ' + (ki + 1) + ')' : '') +
                  (attempt ? ' • আবার চেষ্টা' : ''));
              }
              const raw = parseJSON(await p.run(images, promptText, keys[ki], model, cfg));
              return { data: normalize(raw, fields), model, keyIndex: ki };
            } catch (e) {
              last = e;
              const m = e.message || '';
              if (busyErr(m)) {
                if (onStatus) onStatus('সেবা ব্যস্ত — ৩ সেকেন্ড পরে আবার চেষ্টা করছি…');
                await sleep(3000);
                continue;
              }
              if (quotaErr(m)) break;          // এই key/মডেলে কোটা শেষ — পরেরটা
              if (e.status === 404) break;      // মডেলের নাম চলছে না — পরের মডেল
              throw e;                          // key ভুল ইত্যাদি — সরাসরি জানাই
            }
          }
        }
      }
      throw last || new Error('পড়া যায়নি');
    },

    async test(cfg) {
      const p = PROVIDERS[cfg.provider || 'gemini'];
      const keys = p.noKey ? [''] : keyList(cfg);
      if (!keys.length) throw new Error('key নেই');
      const out = [];
      for (let i = 0; i < keys.length; i++) {
        const label = 'key ' + (i + 1) + ': ';
        try {
          const text = await p.run([], 'শুধু এই JSON দাও, আর কিছু লিখবে না: {"ঠিক":"হ্যাঁ"}',
            keys[i], cfg.model || p.models[0] || '', cfg);
          try {
            parseJSON(text);
            out.push(label + 'ঠিক আছে ✔');
          } catch (e) {
            // উত্তর এসেছে মানে key ও মডেল দুটোই চলছে
            out.push(label + (String(text || '').trim()
              ? 'ঠিক আছে ✔ (উত্তর এসেছে)'
              : 'সেবা ফাঁকা উত্তর দিয়েছে — মডেলের নাম দেখুন'));
          }
        } catch (e) {
          out.push(label + e.message);
        }
      }
      return out;
    }
  };
})();
</script>
<script>/* মোবাইল স্ক্যান অ্যাপ — কাগজ স্ক্যান করে তালিকায় রাখে, পরে কম্পিউটারে পাঠায় */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const kb = (d) => Math.round((String(d).length * 0.75) / 1024);
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem('nk_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: (k, v) => localStorage.setItem('nk_' + k, JSON.stringify(v))
};

const SLOTS = NK.FILE_SLOTS;
const DOCS = NK.DOC_SLOTS;

let cur = { fields: {}, files: {}, ocr: {} };   // যেটা এখন স্ক্যান হচ্ছে
let recs = [];                          // তালিকা (তথ্যসহ, ছবি ছাড়া)
let conn = null, peer = null;
let busy = false;

/* ---------------- IndexedDB ---------------- */
let db = null;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('nk_scan', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('recs')) d.createObjectStore('recs', { keyPath: 'id' });
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}
const tx = (mode) => db.transaction('recs', mode).objectStore('recs');
function dbPut(rec) { return new Promise((res, rej) => { const q = tx('readwrite').put(rec); q.onsuccess = res; q.onerror = () => rej(q.error); }); }
function dbAll() { return new Promise((res, rej) => { const q = tx('readonly').getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); }); }
function dbGet(id) { return new Promise((res, rej) => { const q = tx('readonly').get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
function dbDel(id) { return new Promise((res, rej) => { const q = tx('readwrite').delete(id); q.onsuccess = res; q.onerror = () => rej(q.error); }); }

/* ---------------- ছবি ---------------- */
function takePhoto(slot) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.setAttribute('capture', 'environment');
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    toast('প্রসেস হচ্ছে…');
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => setTimeout(() => {
        const isPhoto = slot === '__photo';
        const r = isPhoto ? NKFX.photo(img) : NKFX.doc(img, { bw: LS.get('bw', true) });
        cur.files[slot] = r.out;
        if (r.ocr) cur.ocr[slot] = r.ocr; else delete cur.ocr[slot];
        renderSlots();
        if (isPhoto) toast('ছবি নেওয়া হয়েছে');
        else toast(r.cropped
          ? SLOTS[slot] + ' — কিনারা কেটে সোজা করা হয়েছে (' + kb(r.out) + ' KB)'
          : SLOTS[slot] + ' — কিনারা পাওয়া যায়নি, পুরো ছবিই রাখা হলো। কাগজটি একরঙা মেঝে/টেবিলে রেখে আবার তুলুন।');
        if (LS.get('mode', 'list') === 'live' && conn && conn.open) {
          conn.send({ slot, dataURL: cur.files[slot], ocr: cur.ocr[slot] || null });
          toast(SLOTS[slot] + ' কম্পিউটারে পাঠানো হয়েছে');
        }
      }, 30);
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  };
  inp.click();
}

/* ---------------- কাগজ পড়া ---------------- */
async function readDocs() {
  if (busy) return;
  const have = Object.keys(DOCS).filter((k) => cur.files[k]);
  if (!have.length) { toast('আগে অন্তত একটি কাগজের ছবি তুলুন'); return; }
  const cfg = {
    provider: LS.get('provider', 'gemini'),
    apiKeys: LS.get('keys', ''),
    model: LS.get('model', ''),
    baseUrl: LS.get('baseUrl', '')
  };
  const prov = NKOCR.PROVIDERS[cfg.provider] || {};
  if (!prov.noKey && !cfg.apiKeys) { toast('সেটিং-এ API key বসান'); show('set'); return; }
  busy = true;
  $('read').textContent = 'পড়া হচ্ছে…';
  try {
    const images = have.map((k) => ({ label: DOCS[k], b64: (cur.ocr[k] || cur.files[k]).split(',')[1] }));
    const out = await NKOCR.read(cfg, images, NK.FIELDS, toast);
    const consts = LS.get('consts', {});
    NK.FIELDS.forEach((f) => {
      const v = out.data[f.k];
      cur.fields[f.k] = (v != null && String(v).trim() !== '') ? String(v).trim() : (cur.fields[f.k] || consts[f.k] || '');
    });
    renderFields();
    const bad = NK.FIELDS.filter((f) => NK.check(f.k, cur.fields[f.k])).length;
    toast(bad ? 'পড়া হয়েছে — ' + bad + ' টি ঘর দেখে নিন' : 'পড়া হয়েছে, সব ঠিক দেখাচ্ছে');
  } catch (e) {
    toast('পড়া যায়নি: ' + e.message);
    const consts = LS.get('consts', {});
    NK.FIELDS.forEach((f) => { if (cur.fields[f.k] == null) cur.fields[f.k] = consts[f.k] || ''; });
    renderFields();
  } finally {
    busy = false;
    $('read').textContent = 'কাগজ পড়ো';
  }
}

/* ---------------- সংরক্ষণ ও তালিকা ---------------- */
async function saveRec() {
  if (!Object.keys(cur.fields).length) { toast('আগে কাগজ পড়ুন বা ঘরগুলো লিখুন'); return; }
  const id = cur.id || ('r' + Date.now().toString(36));
  const rec = { id, fields: Object.assign({}, cur.fields), files: Object.assign({}, cur.files), ocr: Object.assign({}, cur.ocr), at: Date.now() };
  await dbPut(rec);
  cur = { fields: {}, files: {}, ocr: {} };
  renderSlots(); renderFields();
  await loadList();
  toast('তালিকায় যোগ হয়েছে — মোট ' + recs.length + ' জন');
  show('list');
}

async function loadList() {
  const all = await dbAll();
  all.sort((a, b) => a.at - b.at);
  recs = all;
  renderList();
  $('cnt').textContent = recs.length;
}

async function editRec(id) {
  const r = await dbGet(id);
  if (!r) return;
  cur = { id: r.id, fields: Object.assign({}, r.fields), files: Object.assign({}, r.files), ocr: Object.assign({}, r.ocr || {}) };
  renderSlots(); renderFields();
  show('scan');
}

async function delRec(id) {
  if (!confirm('এই ছাত্রের তথ্য মুছে ফেলা হবে?')) return;
  await dbDel(id);
  await loadList();
}

function csv() {
  const cols = NK.FIELDS.map((f) => f.k);
  const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [cols.map(q).join(',')];
  recs.forEach((r) => lines.push(cols.map((c) => q(r.fields[c])).join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'notun-kuri-talika.csv';
  a.click();
  toast(recs.length + ' জনের CSV নামানো হয়েছে');
}

/* ---------------- কম্পিউটারের সাথে ---------------- */
function connStatus(txt, ok) {
  $('conn').innerHTML = ok ? 'কম্পিউটারে <b>যুক্ত</b>' : '<span class="off">' + esc(txt) + '</span>';
}

function connect(id) {
  id = (id || '').trim();
  if (!id) { connStatus('কোড নেই — এক্সটেনশনের QR স্ক্যান করুন', false); return; }
  if (peer) { try { peer.destroy(); } catch (e) {} }
  connStatus('যুক্ত হচ্ছে…', false);
  peer = new Peer({ debug: 0 });
  peer.on('open', () => {
    conn = peer.connect(id, { reliable: true });
    conn.on('open', () => connStatus('', true));
    conn.on('data', async (msg) => {
      if (msg && msg.type === 'NEED') {
        const r = await dbGet(msg.id);
        if (!r) return;
        conn.send({ type: 'FILES', id: r.id, name: r.fields['খেলোয়াড়ের নাম (বাংলা)'] || '', files: r.files });
      }
    });
    conn.on('close', () => connStatus('সংযোগ কেটে গেছে', false));
    conn.on('error', (e) => connStatus('সমস্যা: ' + e.type, false));
  });
  peer.on('error', (e) => connStatus('যুক্ত হয়নি (' + e.type + ')', false));
}

function sendList() {
  if (!conn || !conn.open) { toast('আগে কম্পিউটারে যুক্ত হন (QR স্ক্যান করুন)'); return; }
  if (!recs.length) { toast('তালিকা খালি'); return; }
  const rows = recs.map((r) => Object.assign({ __id: r.id, __done: false }, r.fields));
  conn.send({ type: 'LIST', rows });
  toast(rows.length + ' জনের তালিকা পাঠানো হয়েছে। কম্পিউটারে একজন একজন করে ফরম পূরণ করুন — ছবি নিজেই যাবে।');
}

/* ---------------- দেখানো ---------------- */
let toastT = null;
function toast(t) {
  $('toast').textContent = t;
  $('toast').style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => { $('toast').style.display = 'none'; }, 6000);
}

function show(tab) {
  ['scan', 'list', 'set'].forEach((t) => {
    $('t_' + t).classList.toggle('on', t === tab);
    $('p_' + t).style.display = t === tab ? 'block' : 'none';
  });
}

function lightbox(items) {
  const list = items.filter((i) => i.src);
  if (!list.length) return;
  $('lb').innerHTML = '<button id="lbx">✕ বন্ধ</button>' +
    list.map((i) => '<div class="cap">' + esc(i.cap) + '</div><img src="' + i.src + '">').join('');
  $('lb').style.display = 'block';
  $('lbx').onclick = () => { $('lb').style.display = 'none'; };
}

function renderSlots() {
  $('slots').innerHTML = Object.keys(SLOTS).map((k) => {
    const d = cur.files[k];
    return '<div class="slot">' +
      (d ? '<img src="' + d + '" data-view="' + k + '">' : '<div class="ph"></div>') +
      '<div class="m"><b>' + esc(SLOTS[k]) + '</b><span>' + (d ? kb(d) + ' KB' : 'বাকি') + '</span></div>' +
      '<button data-cap="' + k + '">' + (d ? 'আবার' : 'তুলুন') + '</button></div>';
  }).join('');
}

function renderFields() {
  const keys = NK.FIELDS.map((f) => f.k);
  if (!Object.keys(cur.fields).length) { $('fields').innerHTML = '<div class="hint">কাগজ পড়ার পর ঘরগুলো এখানে আসবে।</div>'; return; }
  $('fields').innerHTML = keys.map((k) => {
    const w = NK.check(k, cur.fields[k]);
    return '<div class="f' + (w ? ' bad' : '') + '"><label>' + esc(k) + '</label>' +
      '<input data-f="' + esc(k) + '" value="' + esc(cur.fields[k] || '') + '">' +
      '<div class="w">' + (w ? esc(w) : '✔') + '</div></div>';
  }).join('');
}

function renderList() {
  if (!recs.length) { $('list').innerHTML = '<div class="hint">এখনও কেউ নেই।</div>'; return; }
  $('list').innerHTML = recs.map((r, i) => {
    const bad = NK.FIELDS.filter((f) => NK.check(f.k, r.fields[f.k])).length;
    const imgs = Object.keys(r.files || {}).length;
    return '<div class="rec"><div class="n">' + (i + 1) + '. ' + esc(r.fields['খেলোয়াড়ের নাম (বাংলা)'] || '(নাম নেই)') + '</div>' +
      '<div class="s">শ্রেণি ' + esc(r.fields['শ্রেণি'] || '-') + ' • রোল ' + esc(r.fields['রোল নম্বর'] || '-') +
      ' • ছবি ' + imgs + '/6 • ' + (bad ? '<span class="off">' + bad + ' টি ঘর দেখুন</span>' : 'ঠিক আছে') + '</div>' +
      '<div class="b"><button data-ed="' + r.id + '">তথ্য</button><button data-img="' + r.id + '">ছবি</button>' +
      '<button data-del="' + r.id + '">মুছুন</button></div></div>';
  }).join('');
}

function renderConsts() {
  const c = LS.get('consts', {});
  const pin = ['শিক্ষা প্রতিষ্ঠানের নাম', 'লিঙ্গ', 'মোবাইল নম্বর', 'বিভাগ', 'জেলা',
    'উপজেলা / সিটি কর্পোরেশন / পৌরসভা', 'ইউনিয়ন / ওয়ার্ড', 'ইভেন্ট - ১', 'শ্রেণি'];
  $('consts').innerHTML = pin.map((k) =>
    '<div class="f"><label>' + esc(k) + '</label><input data-k="' + esc(k) + '" value="' + esc(c[k] || '') + '"></div>').join('');
}

function showProvider(reset) {
  const p = NKOCR.PROVIDERS[$('provider').value];
  $('models').innerHTML = p.models.map((m) => '<option value="' + m + '"></option>').join('');
  if (reset || !LS.get('model', '')) $('model').value = p.models[0] || '';
  else $('model').value = LS.get('model', '');
  $('keyHint').textContent = p.keyHint;
  const noKey = !!p.noKey;
  $('keys').style.display = noKey ? 'none' : '';
  const custom = $('provider').value === 'custom';
  $('baseUrl').style.display = custom ? '' : 'none';
  $('baseLbl').style.display = custom ? '' : 'none';
}

/* ---------------- ইভেন্ট ---------------- */
document.addEventListener('click', (e) => {
  if (e.target.id === 'lb') { $('lb').style.display = 'none'; return; }
  const vw = e.target.closest('[data-view]');
  if (vw) {
    const k = vw.getAttribute('data-view');
    return lightbox([
      { cap: SLOTS[k] + ' — যেটি ফরমে আপলোড হবে', src: cur.files[k] },
      { cap: 'পড়ার জন্য ধূসর কপি', src: cur.ocr[k] }
    ]);
  }
  const im = e.target.closest('[data-img]');
  if (im) {
    const r = recs.find((x) => x.id === im.getAttribute('data-img'));
    if (r) return lightbox(Object.keys(SLOTS).map((k) => ({ cap: SLOTS[k], src: (r.files || {})[k] })));
  }
  const cap = e.target.closest('[data-cap]');
  if (cap) return takePhoto(cap.getAttribute('data-cap'));
  const ed = e.target.closest('[data-ed]');
  if (ed) return editRec(ed.getAttribute('data-ed'));
  const dl = e.target.closest('[data-del]');
  if (dl) return delRec(dl.getAttribute('data-del'));
});

$('fields').addEventListener('input', (e) => {
  const inp = e.target.closest('[data-f]');
  if (!inp) return;
  const k = inp.getAttribute('data-f');
  cur.fields[k] = inp.value;
  const box = inp.closest('.f');
  const w = NK.check(k, inp.value);
  box.classList.toggle('bad', !!w);
  box.querySelector('.w').textContent = w || '✔';
});

$('t_scan').onclick = () => show('scan');
$('t_list').onclick = () => show('list');
$('t_set').onclick = () => show('set');
$('read').onclick = readDocs;
$('save').onclick = saveRec;
$('sendOne').onclick = () => {
  if (!conn || !conn.open) { toast('আগে কম্পিউটারে যুক্ত হন (QR স্ক্যান করুন)'); return; }
  if (!Object.keys(cur.fields).length) { toast('আগে কাগজ পড়ুন'); return; }
  conn.send({ type: 'RECORD', fields: cur.fields, files: cur.files });
  toast('তথ্য ও ছবি কম্পিউটারে পাঠানো হয়েছে — ওখানে “ফরমে বসাও” চাপুন।');
};
$('csv').onclick = csv;
$('sendList').onclick = sendList;
$('newRec').onclick = () => { cur = { fields: {}, files: {}, ocr: {} }; renderSlots(); renderFields(); show('scan'); toast('নতুন ছাত্র — কাগজ তুলুন'); };

$('saveSet').onclick = () => {
  LS.set('provider', $('provider').value);
  LS.set('keys', $('keys').value.trim());
  LS.set('model', $('model').value.trim());
  LS.set('baseUrl', $('baseUrl').value.trim());
  LS.set('mode', $('mode').value);
  LS.set('bw', $('bw').checked);
  const c = {};
  document.querySelectorAll('[data-k]').forEach((i) => { if (i.value.trim()) c[i.getAttribute('data-k')] = i.value.trim(); });
  LS.set('consts', c);
  toast('সেটিং সংরক্ষণ হয়েছে');
};
$('doConnect').onclick = () => connect($('code').value);
$('wipe').onclick = async () => {
  if (!confirm('তালিকার সব ছাত্র মুছে ফেলা হবে। নিশ্চিত?')) return;
  for (const r of recs) await dbDel(r.id);
  await loadList();
  toast('সব মুছে ফেলা হয়েছে');
};

/* ---------------- শুরু ---------------- */
(async () => {
  $('provider').innerHTML = Object.keys(NKOCR.PROVIDERS)
    .map((k) => '<option value="' + k + '">' + NKOCR.PROVIDERS[k].name + '</option>').join('');
  $('provider').value = LS.get('provider', 'gemini');
  $('provider').addEventListener('change', () => showProvider(true));
  $('keys').value = LS.get('keys', '');
  $('baseUrl').value = LS.get('baseUrl', '');
  showProvider(false);
  $('mode').value = LS.get('mode', 'list');
  $('bw').checked = LS.get('bw', true);
  renderConsts();
  renderSlots();
  renderFields();
  await openDB();
  await loadList();
  const id = location.hash.replace('#', '').trim();
  if (id) { $('code').value = id; connect(id); }
  else connStatus('কোড নেই — এক্সটেনশনের QR স্ক্যান করুন', false);
  const p0 = NKOCR.PROVIDERS[LS.get('provider', 'gemini')] || {};
  if (!p0.noKey && !LS.get('keys', '')) { show('set'); toast('প্রথমে সেটিং-এ API key বসান'); }
})();
</script>
