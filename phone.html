<!DOCTYPE html>
<html lang="bn">
<head>

<title>নতুন কুঁড়ি — মোবাইল ক্যামেরা</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:#0a1c16;color:#e8f1ec;padding:12px;line-height:1.5}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
  h1{font-size:15px;font-weight:600}
  #st{font-size:12px;color:#8fb5a4}
  #st b{color:#4fd39a}
  .off{color:#e0917a}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .card{background:#10261f;border:1px solid #22493a;border-radius:11px;overflow:hidden}
  .card.done{border-color:#2f9e6f}
  .card .shot{width:100%;height:108px;background:#06120e;border:none;border-radius:0;display:block;color:#8fb5a4;font-size:13px;padding:0;cursor:pointer}
  .card img{width:100%;height:108px;object-fit:cover;display:block;cursor:zoom-in}
  .card .row{display:flex;align-items:center;gap:6px;padding:7px 8px}
  .card .row .t{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .row .t i{display:block;font-style:normal;font-size:10.5px;color:#8fb5a4}
  .card .row button{width:auto;padding:5px 9px;font-size:11.5px}
  .card.done .row .t i{color:#4fd39a}
  button{font-size:13.5px;padding:10px;border-radius:9px;border:1px solid #2c5b49;background:#1c4033;color:#e8f1ec;cursor:pointer;width:100%}
  .opt{display:flex;gap:9px;align-items:center;margin-top:11px;font-size:12.5px;color:#a9cdbd;background:#10261f;border:1px solid #22493a;border-radius:9px;padding:10px}
  .opt input{width:auto}
  #msg{margin-top:9px;background:#10261f;border-left:3px solid #f59e0b;border-radius:7px;padding:9px 11px;font-size:12.5px}
  #pv{display:none;position:fixed;inset:0;background:rgba(3,10,8,.97);z-index:100;padding:10px;flex-direction:column}
  #pv .cap{text-align:center;font-size:12.5px;color:#a9cdbd;padding:6px 0}
  #pv .box{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}
  #pv img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
  #pv .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:10px}
  #pv .ok{background:#2f9e6f;border-color:#2f9e6f;color:#06231a;font-weight:600;font-size:17px;padding:16px}
  #pv .no{background:#5d2b21;border-color:#8a4030;color:#ffd9cd;font-size:17px;padding:16px}
  #lb{display:none;position:fixed;inset:0;background:rgba(3,10,8,.96);z-index:99;padding:12px;overflow:auto;text-align:center}
  #lb img{max-width:100%;background:#fff;border-radius:6px}
  #lb button{width:auto;padding:9px 16px;margin-bottom:10px}

<body>
  <div class="top"><h1>মোবাইল ক্যামেরা</h1><div id="st">যুক্ত হচ্ছে…</div></div>

  <div class="grid" id="grid"></div>

  <label class="opt"><input type="checkbox" id="auto"> কাগজের কিনারা নিজে থেকে কেটে সোজা করবে</label>
  <div id="msg">যে কাগজের ঘরে চাপ দেবেন, ফোনের ক্যামেরা খুলবে। ছবি তোলার পর দেখে ✔ দিলে কম্পিউটারে যাবে, ✘ দিলে বাদ।</div>

  <div id="lb"></div>
  <div id="pv">
    <div class="cap" id="pvcap"></div>
    <div class="box"><img id="pvimg"></div>
    <div class="btns">
      <button class="no" id="pvno">✘ আবার তুলবো</button>
      <button class="ok" id="pvok">✔ কম্পিউটারে পাঠাও</button>
    </div>
  </div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>/* কাগজের কিনারা খুঁজে বাইরের অংশ বাদ দিয়ে পেজ সোজা করে সাদা-কালো করার অংশ */
(() => {
if (typeof window !== 'undefined' && window.NKFX) return;

const MAX_OUT = 1500;   // ফলাফলের সর্বোচ্চ লম্বা দিক
const MAX_SRC = 2200;   // নমুনা নেওয়ার ছবির সর্বোচ্চ দিক
const AN = 640;         // কিনারা খোঁজার জন্য ছোট কপি

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function scaled(img, maxLong) {
  const sw = img.naturalWidth || img.videoWidth || img.width;
  const sh = img.naturalHeight || img.videoHeight || img.height;
  const k = Math.max(sw, sh) > maxLong ? maxLong / Math.max(sw, sh) : 1;
  const c = cv(Math.round(sw * k), Math.round(sh * k));
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0, c.width, c.height);
  return c;
}

function grayOf(canvas) {
  const w = canvas.width, h = canvas.height;
  const d = canvas.getContext('2d').getImageData(0, 0, w, h).data;
  const g = new Uint8Array(w * h);
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    g[p] = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;
  }
  return g;
}

function otsu(g) {
  const hist = new Float64Array(256);
  for (let i = 0; i < g.length; i++) hist[g[i]]++;
  const total = g.length;
  let sum = 0;
  for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t];
    if (!wB) continue;
    const wF = total - wB;
    if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const v = wB * wF * (mB - mF) * (mB - mF);
    if (v > best) { best = v; thr = t; }
  }
  return thr;
}

/* সবচেয়ে বড় উজ্জ্বল অংশ (কাগজ সাধারণত টেবিলের চেয়ে হালকা) */
function biggestBlob(g, w, h, thr) {
  const lab = new Int32Array(w * h);
  const q = new Int32Array(w * h);
  let cur = 0, bestId = 0, bestArea = 0;
  for (let s = 0; s < w * h; s++) {
    if (lab[s] || g[s] <= thr) continue;
    cur++;
    let head = 0, tail = 0, area = 0;
    q[tail++] = s; lab[s] = cur;
    while (head < tail) {
      const p = q[head++]; area++;
      const x = p % w, y = (p - x) / w;
      if (x > 0 && !lab[p - 1] && g[p - 1] > thr) { lab[p - 1] = cur; q[tail++] = p - 1; }
      if (x < w - 1 && !lab[p + 1] && g[p + 1] > thr) { lab[p + 1] = cur; q[tail++] = p + 1; }
      if (y > 0 && !lab[p - w] && g[p - w] > thr) { lab[p - w] = cur; q[tail++] = p - w; }
      if (y < h - 1 && !lab[p + w] && g[p + w] > thr) { lab[p + w] = cur; q[tail++] = p + w; }
    }
    if (area > bestArea) { bestArea = area; bestId = cur; }
  }
  return { lab, id: bestId, area: bestArea };
}

/* অংশটির চার কোনা — ঘোরানো আয়তক্ষেত্রের জন্য এটাই যথেষ্ট */
function quadOf(lab, id, w, h) {
  let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
  let tl = null, br = null, tr = null, bl = null;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (lab[y * w + x] !== id) continue;
      const s = x + y, df = x - y;
      if (s < a) { a = s; tl = [x, y]; }
      if (s > b) { b = s; br = [x, y]; }
      if (df > d) { d = df; tr = [x, y]; }
      if (df < c) { c = df; bl = [x, y]; }
    }
  }
  if (!tl || !tr || !br || !bl) return null;
  return [tl, tr, br, bl];
}

const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);

function quadOk(quad, w, h) {
  if (!quad) return false;
  const sides = [dist(quad[0], quad[1]), dist(quad[1], quad[2]), dist(quad[2], quad[3]), dist(quad[3], quad[0])];
  const small = Math.min(w, h);
  if (Math.min.apply(null, sides) < small * 0.45) return false;
  // ক্ষেত্রফল (shoelace)
  let ar = 0;
  for (let i = 0; i < 4; i++) {
    const p = quad[i], q = quad[(i + 1) % 4];
    ar += p[0] * q[1] - q[0] * p[1];
  }
  ar = Math.abs(ar) / 2;
  const frac = ar / (w * h);
  return frac > 0.4 && frac < 0.97;
}

/* dst আয়তক্ষেত্র → src চতুর্ভুজ, ৮টি অজানা */
function homography(dst, src) {
  const A = [], B = [];
  for (let i = 0; i < 4; i++) {
    const [u, v] = dst[i], [x, y] = src[i];
    A.push([u, v, 1, 0, 0, 0, -u * x, -v * x]); B.push(x);
    A.push([0, 0, 0, u, v, 1, -u * y, -v * y]); B.push(y);
  }
  for (let i = 0; i < 8; i++) {
    let piv = i;
    for (let r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[piv][i])) piv = r;
    if (Math.abs(A[piv][i]) < 1e-9) return null;
    if (piv !== i) { const t = A[i]; A[i] = A[piv]; A[piv] = t; const tb = B[i]; B[i] = B[piv]; B[piv] = tb; }
    for (let r = i + 1; r < 8; r++) {
      const f = A[r][i] / A[i][i];
      if (!f) continue;
      for (let c2 = i; c2 < 8; c2++) A[r][c2] -= f * A[i][c2];
      B[r] -= f * B[i];
    }
  }
  const X = new Array(8).fill(0);
  for (let i = 7; i >= 0; i--) {
    let s = B[i];
    for (let c2 = i + 1; c2 < 8; c2++) s -= A[i][c2] * X[c2];
    X[i] = s / A[i][i];
  }
  return X;
}

function warp(srcCanvas, quad, outW, outH) {
  const H = homography([[0, 0], [outW, 0], [outW, outH], [0, outH]], quad);
  if (!H) return null;
  const sw = srcCanvas.width, sh = srcCanvas.height;
  const sdat = srcCanvas.getContext('2d').getImageData(0, 0, sw, sh).data;
  const out = cv(outW, outH);
  const octx = out.getContext('2d');
  const odat = octx.createImageData(outW, outH);
  const o = odat.data;
  const [a, b, c, d, e, f, g, hh] = H;
  for (let v = 0; v < outH; v++) {
    for (let u = 0; u < outW; u++) {
      const den = g * u + hh * v + 1;
      const x = (a * u + b * v + c) / den;
      const y = (d * u + e * v + f) / den;
      const i = (v * outW + u) * 4;
      if (x < 0 || y < 0 || x > sw - 1 || y > sh - 1) { o[i] = o[i + 1] = o[i + 2] = 255; o[i + 3] = 255; continue; }
      const x0 = x | 0, y0 = y | 0;
      const x1 = Math.min(x0 + 1, sw - 1), y1 = Math.min(y0 + 1, sh - 1);
      const fx = x - x0, fy = y - y0;
      for (let ch = 0; ch < 3; ch++) {
        const p00 = sdat[(y0 * sw + x0) * 4 + ch], p10 = sdat[(y0 * sw + x1) * 4 + ch];
        const p01 = sdat[(y1 * sw + x0) * 4 + ch], p11 = sdat[(y1 * sw + x1) * 4 + ch];
        o[i + ch] = (p00 * (1 - fx) + p10 * fx) * (1 - fy) + (p01 * (1 - fx) + p11 * fx) * fy;
      }
      o[i + 3] = 255;
    }
  }
  octx.putImageData(odat, 0, 0);
  return out;
}

/* কনট্রাস্ট বাড়ানো ধূসর কপি — পড়ার জন্য ভালো */
function enhance(canvas) {
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d');
  const id = ctx.getImageData(0, 0, w, h);
  const d = id.data;
  const hist = new Float64Array(256);
  for (let i = 0; i < d.length; i += 4) {
    const g = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000 | 0;
    hist[g]++;
  }
  const total = w * h;
  let lo = 0, hi = 255, acc = 0;
  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > total * 0.02) { lo = i; break; } }
  acc = 0;
  for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > total * 0.02) { hi = i; break; } }
  const span = Math.max(1, hi - lo);
  const out = cv(w, h);
  const oid = out.getContext('2d').createImageData(w, h);
  const o = oid.data;
  for (let i = 0; i < d.length; i += 4) {
    let g = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;
    g = ((g - lo) / span) * 255;
    g = g < 0 ? 0 : (g > 255 ? 255 : g);
    o[i] = o[i + 1] = o[i + 2] = g;
    o[i + 3] = 255;
  }
  out.getContext('2d').putImageData(oid, 0, 0);
  return out;
}

/* স্থানীয় গড় ধরে সাদা-কালো (Bradley) — ছায়া পড়লেও লেখা থাকে */
function blackWhite(canvas) {
  const w = canvas.width, h = canvas.height;
  const d = canvas.getContext('2d').getImageData(0, 0, w, h).data;
  const g = new Float64Array(w * h);
  for (let i = 0, p = 0; i < d.length; i += 4, p++) g[p] = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;

  const S = new Float64Array((w + 1) * (h + 1));
  for (let y = 1; y <= h; y++) {
    let rowsum = 0;
    for (let x = 1; x <= w; x++) {
      rowsum += g[(y - 1) * w + (x - 1)];
      S[y * (w + 1) + x] = S[(y - 1) * (w + 1) + x] + rowsum;
    }
  }
  const win = Math.max(15, Math.round(w / 22)) | 1;
  const r = win >> 1;
  const out = cv(w, h);
  const oid = out.getContext('2d').createImageData(w, h);
  const o = oid.data;
  for (let y = 0; y < h; y++) {
    const y1 = Math.max(0, y - r), y2 = Math.min(h - 1, y + r);
    for (let x = 0; x < w; x++) {
      const x1 = Math.max(0, x - r), x2 = Math.min(w - 1, x + r);
      const n = (x2 - x1 + 1) * (y2 - y1 + 1);
      const sum = S[(y2 + 1) * (w + 1) + (x2 + 1)] - S[y1 * (w + 1) + (x2 + 1)]
        - S[(y2 + 1) * (w + 1) + x1] + S[y1 * (w + 1) + x1];
      const mean = sum / n;
      const v = g[y * w + x] < mean * 0.86 ? 0 : 255;
      const i = (y * w + x) * 4;
      o[i] = o[i + 1] = o[i + 2] = v;
      o[i + 3] = 255;
    }
  }
  out.getContext('2d').putImageData(oid, 0, 0);
  return out;
}

function pack(canvas, cap, forceJPEG) {
  let q = 0.88;
  let jpg = canvas.toDataURL('image/jpeg', q);
  if (!forceJPEG) {
    const png = canvas.toDataURL('image/png');
    if (png.length < jpg.length && png.length * 0.75 < cap) return png;
  }
  while (jpg.length * 0.75 > cap && q > 0.35) { q -= 0.12; jpg = canvas.toDataURL('image/jpeg', q); }
  return jpg;
}

window.NKFX = {
  /* কোনো কাটাকুটি নয় — শুধু মাপ ছোট করে রঙিন রাখা */
  plain(img) {
    const c = scaled(img, 1700);
    return { out: pack(c, 1500 * 1024, true), ocr: null, cropped: false };
  },

  /* ছাত্রের ছবি — রঙিন, ৩:৪ */
  photo(img) {
    const sw = img.naturalWidth || img.videoWidth, sh = img.naturalHeight || img.videoHeight;
    const ratio = 3 / 4;
    let cw = sh * ratio, ch = sh;
    if (cw > sw) { cw = sw; ch = sw / ratio; }
    const c = cv(600, 800);
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, 600, 800);
    x.drawImage(img, (sw - cw) / 2, (sh - ch) / 2, cw, ch, 0, 0, 600, 800);
    return { out: pack(c, 700 * 1024, true), ocr: null, cropped: false };
  },

  /* কাগজ — কিনারা খুঁজে সোজা করে সাদা-কালো */
  doc(img, opt) {
    const bw = !opt || opt.bw !== false;
    const src = scaled(img, MAX_SRC);
    const small = scaled(img, AN);
    let straight = null, cropped = false;

    try {
      const g = grayOf(small);
      const thr = otsu(g);
      const blob = biggestBlob(g, small.width, small.height, thr);
      const quad = blob.id ? quadOf(blob.lab, blob.id, small.width, small.height) : null;
      if (quadOk(quad, small.width, small.height)) {
        const k = src.width / small.width;
        const q = quad.map((p) => [p[0] * k, p[1] * k]);
        let ow = (dist(q[0], q[1]) + dist(q[3], q[2])) / 2;
        let oh = (dist(q[0], q[3]) + dist(q[1], q[2])) / 2;
        const sc = Math.max(ow, oh) > MAX_OUT ? MAX_OUT / Math.max(ow, oh) : 1;
        ow = Math.max(200, Math.round(ow * sc));
        oh = Math.max(200, Math.round(oh * sc));
        straight = warp(src, q, ow, oh);
        cropped = !!straight;
      }
    } catch (e) { straight = null; }

    if (!straight) straight = scaled(img, MAX_OUT);

    // রঙিন রাখতে বলা হলে শুধু কিনারা কাটা ও সোজা করা — ছবির রং বদলায় না
    if (opt && opt.color) {
      return { out: pack(straight, 1500 * 1024, true), ocr: null, cropped: cropped };
    }

    const gray = enhance(straight);
    const finalC = bw ? blackWhite(gray) : gray;
    return {
      out: pack(finalC, 1500 * 1024, false),
      ocr: pack(gray, 900 * 1024, true),
      cropped
    };
  },

  process(img, opt) {
    return (opt && opt.doc === false) ? window.NKFX.photo(img) : window.NKFX.doc(img, opt);
  }
};
})();
</script>
<script>
const LABEL = {
  __photo: 'ছাত্রের ছবি', __birth: 'জন্ম নিবন্ধন', __nid: 'অভিভাবকের এনআইডি',
  __certificate: 'প্রত্যয়নপত্র', __extra1: 'ভর্তি রেজি. / ফলাফল', __extra2: 'আইডি / প্রত্যয়নের কপি'
};
const thumbs = {};
let conn = null, pending = null, busy = false;
const $ = (id) => document.getElementById(id);
const say = (t) => { $('msg').textContent = t; };
const kb = (d) => Math.round((d.length * 0.75) / 1024);

function status(t, ok) {
  $('st').innerHTML = ok ? 'কম্পিউটারে <b>যুক্ত</b>' : '<span class="off">' + t + '</span>';
}

function render() {
  $('grid').innerHTML = Object.keys(LABEL).map((k) => {
    const d = thumbs[k];
    return '<div class="card' + (d ? ' done' : '') + '">' +
      (d ? '<img src="' + d + '" data-view="' + k + '">'
         : '<button class="shot" data-cap="' + k + '">＋ ছবি তুলুন</button>') +
      '<div class="row"><div class="t">' + LABEL[k] +
      '<i>' + (d ? 'পাঠানো হয়েছে ✔ • ' + kb(d) + ' KB' : 'বাকি') + '</i></div>' +
      (d ? '<button data-cap="' + k + '">আবার</button>' : '') +
      '</div></div>';
  }).join('');
}

/* ফোনের নিজের ক্যামেরা অ্যাপ খোলে — যা দেখবেন ঠিক তাই ওঠে */
function openCamera(slot) {
  if (busy) return;
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.setAttribute('capture', 'environment');
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    busy = true;
    say('প্রসেস হচ্ছে…');
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => setTimeout(() => {
        try {
          const auto = $('auto').checked;
          const r = (slot === '__photo')
            ? NKFX.photo(img)
            : (auto ? NKFX.doc(img, { color: true }) : NKFX.plain(img));
          pending = { slot: slot, out: r.out };
          $('pvimg').src = r.out;
          $('pvcap').textContent = LABEL[slot] + ' • ' + kb(r.out) + ' KB' +
            (slot === '__photo' ? '' : (r.cropped ? ' • কিনারা কেটে সোজা করা হয়েছে'
              : ($('auto').checked ? ' • কিনারা মেলেনি, যেমন তুলেছেন তেমনই' : ' • যেমন তুলেছেন তেমনই')));
          $('pv').style.display = 'flex';
          say('দেখে নিন — ঠিক থাকলে ✔ দিন।');
        } catch (e) {
          say('ছবি প্রসেস হয়নি: ' + e.message);
        }
        busy = false;
      }, 30);
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  };
  inp.click();
}

function accept() {
  if (!pending) return;
  if (!conn || !conn.open) { say('কম্পিউটারের সাথে যুক্ত নয়। QR কোডটি আবার স্ক্যান করুন।'); return; }
  conn.send({ slot: pending.slot, dataURL: pending.out });
  thumbs[pending.slot] = pending.out;
  say(LABEL[pending.slot] + ' কম্পিউটারে পাঠানো হয়েছে (' + kb(pending.out) + ' KB)।');
  pending = null;
  $('pv').style.display = 'none';
  $('pvimg').src = '';
  render();
}

function reject() {
  pending = null;
  $('pv').style.display = 'none';
  $('pvimg').src = '';
  say('বাদ দেওয়া হলো — আবার ছবি তুলুন।');
}

function view(k) {
  if (!thumbs[k]) return;
  $('lb').innerHTML = '<button id="lbx">✕ বন্ধ</button><br><img src="' + thumbs[k] + '">';
  $('lb').style.display = 'block';
  $('lbx').onclick = () => { $('lb').style.display = 'none'; };
}

function connect() {
  const id = location.hash.replace('#', '').trim();
  if (!id) { status('কোড নেই — এক্সটেনশনের QR স্ক্যান করুন', false); return; }
  const peer = new Peer({ debug: 0 });
  peer.on('open', () => {
    conn = peer.connect(id, { reliable: true });
    conn.on('open', () => status('', true));
    conn.on('close', () => status('সংযোগ কেটে গেছে — পেজ রিফ্রেশ করুন', false));
    conn.on('error', (e) => status('সমস্যা: ' + e.type, false));
  });
  peer.on('error', (e) => status('যুক্ত হয়নি (' + e.type + ') — QR আবার স্ক্যান করুন', false));
}

document.addEventListener('click', (e) => {
  if (e.target.id === 'lb') { $('lb').style.display = 'none'; return; }
  const c = e.target.closest('[data-cap]');
  if (c) return openCamera(c.getAttribute('data-cap'));
  const v = e.target.closest('[data-view]');
  if (v) return view(v.getAttribute('data-view'));
});

$('pvok').addEventListener('click', accept);
$('pvno').addEventListener('click', reject);

$('auto').checked = localStorage.getItem('nk_autocrop') === '1';
$('auto').addEventListener('change', () => {
  localStorage.setItem('nk_autocrop', $('auto').checked ? '1' : '0');
  say($('auto').checked
    ? 'অটো-কাটা চালু। ভুল জায়গা কাটলে ✘ দিয়ে বাতিল করে টিক তুলে দিন।'
    : 'অটো-কাটা বন্ধ। ছবি যেমন তুলবেন ঠিক তেমনই যাবে।');
});

render();
connect();
</script>
</body>
</html>
